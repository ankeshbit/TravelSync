services:
  - type: web
    name: travelsync-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: travelsync-uploads
      mountPath: /var/data/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OTP_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM
        value: "TravelSync" <notifications@travelsync.app>

